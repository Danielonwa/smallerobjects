<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Smaller Objects — carefully considered things for everyday life." />
  <title>Smaller Objects — Design for everyday life</title>
  <link rel="preconnect" href="https://smallerobjects.com" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div class="announcement">Objects worth keeping · Shipping throughout the EU, Japan &amp; the US</div>
  <header class="site-header">
    <button class="mobile-menu" aria-label="Open menu" id="menu-button"><span></span><span></span></button>
    <a href="#home" class="wordmark" data-route="home" aria-label="Smaller Objects home">smaller<br><i>objects</i></a>
    <nav class="main-nav" aria-label="Main navigation">
      <a href="#shop" data-route="shop">Shop</a><a href="#designers" data-route="designers">Designers</a><a href="#about" data-route="about">About</a><a href="#contact" data-route="contact">Contact</a>
    </nav>
    <div class="header-actions">
      <button class="icon-button" id="search-button" aria-label="Search"><svg viewBox="0 0 24 24"><circle cx="10.8" cy="10.8" r="6.5"/><path d="m16 16 4.2 4.2"/></svg></button>
      <button class="bag-button" id="cart-button" aria-label="Open shopping cart">Cart <span id="cart-count">0</span></button>
    </div>
  </header>
  <main id="app"></main>
  <footer id="site-footer"></footer>
  <div class="overlay" id="overlay"></div>
  <aside class="cart-drawer" id="cart-drawer" aria-label="Shopping cart">
    <div class="drawer-top"><span>Your cart <em id="drawer-count">0</em></span><button class="close" data-close="cart-drawer" aria-label="Close cart">×</button></div>
    <div id="cart-items" class="cart-items"><p class="empty-state">Your cart is waiting for something special.</p></div>
    <div class="cart-bottom"><div class="subtotal"><span>Subtotal</span><strong id="cart-total">€0</strong></div><small>Taxes and shipping calculated at checkout.</small><a href="#checkout" class="checkout" id="checkout-link">Secure checkout <span>→</span></a></div>
  </aside>
  <section class="search-panel" id="search-panel" aria-label="Product search">
    <div><button class="close" data-close="search-panel" aria-label="Close search">×</button><p class="eyebrow">Find an object</p><input id="search-input" type="search" placeholder="Search the collection" autocomplete="off" /><div id="search-results"></div></div>
  </section>
  <aside class="mobile-drawer" id="mobile-drawer"><button class="close" data-close="mobile-drawer">×</button><a href="#shop" data-route="shop">Shop</a><a href="#designers" data-route="designers">Designers</a><a href="#about" data-route="about">About</a><a href="#press" data-route="press">Press</a><a href="#contact" data-route="contact">Contact</a></aside>
  <script src="app.js"></script>
</body>
</html>
